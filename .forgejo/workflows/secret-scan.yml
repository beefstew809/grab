name: secret-scan

# gitleaks over every PR's commits and every push to main, through a shared
# reusable workflow; a failed scan of a push also alerts the maintainer.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    uses: homelab/ci-workflows/.forgejo/workflows/secret-scan.yml@main
    with:
      caller_event_name: ${{ github.event_name }}
      caller_before: ${{ github.event.before }}
    secrets: inherit
