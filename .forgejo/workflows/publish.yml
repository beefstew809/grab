name: publish

# The only path to the public side. On main: re-prove the gates, then
# fast-forward GitHub's main. On a v* tag: re-prove the gates, build the image
# and push it by digest only, scan it, apply the version tags on ghcr.io only
# if the scan passed, then push the tag to GitHub.
#
# Workflows can't depend on other workflows, so `checks` repeats the guard and
# the tests instead of trusting the separate guard/test runs. Nothing is ever
# force-pushed: if GitHub's main has moved on its own, the push is refused and
# this run fails.
on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/beefstew809/grab
  GITHUB_REPO: https://github.com/beefstew809/grab.git

jobs:
  checks:
    runs-on: docker
    env:
      GRAB_DENYLIST: ${{ secrets.GRAB_DENYLIST }}
      GRAB_ALLOWED_EMAILS: "30852148+beefstew809@users.noreply.github.com,bot@renovateapp.com"
      SHARE_TEST_ENCODER: libx264
      SHARE_REQUIRE_FFMPEG: "1"
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require the deny-list
        run: |
          if [ -z "$GRAB_DENYLIST" ]; then
            echo "GRAB_DENYLIST is not set; refusing to publish" >&2
            exit 1
          fi

      - name: Install ffmpeg
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -encoders | grep libx264 > /dev/null

      - name: Set up Go
        uses: https://data.forgejo.org/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: go vet and go test
        run: go vet ./... && go test ./...

      - name: File tree guard
        run: |
          go test -count=1 -run '^TestNoPersonalStrings$' -v . > tree.log 2>&1 || { cat tree.log; exit 1; }
          cat tree.log
          if grep -e '--- SKIP' tree.log > /dev/null; then
            echo "tree check skipped" >&2
            exit 1
          fi

      - name: Commit and tag metadata guard
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            sh scripts/public-guard.sh --all "$REF_NAME"
          else
            sh scripts/public-guard.sh --all
          fi

      # The separate secret-scan workflow only gates merges; direct pushes to
      # main would still publish. Scan the whole history here, before GitHub.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1" # bump this line to update gitleaks
        run: |
          set -eu
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          work=$(mktemp -d)
          curl -sSL -o "$work/$tarball" "$base/$tarball"
          curl -sSL -o "$work/$sums" "$base/$sums"
          ( cd "$work" && grep " ${tarball}\$" "$sums" | sha256sum -c - )
          tar -xzf "$work/$tarball" -C "$work" gitleaks
          "$work/gitleaks" git --log-opts="--all" --redact --no-banner .
          rm -rf "$work"

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    # `build`: the runner with a remote BuildKit daemon (generic service name).
    runs-on: build
    env:
      GRAB_DENYLIST: ${{ secrets.GRAB_DENYLIST }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: https://data.forgejo.org/docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: remote
          endpoint: tcp://buildkitd:1234

      - name: Log in to ghcr.io
        uses: https://data.forgejo.org/docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: beefstew809
          password: ${{ secrets.GH_TOKEN }}

      # Published versions never move: a re-run or a moved git tag must not
      # silently re-point X.Y.Z at a new build.
      - name: Refuse an existing version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${REF_NAME#v}" > /dev/null 2>&1; then
            echo "${IMAGE}:${REF_NAME#v} already exists; release a new version instead" >&2
            exit 1
          fi

      # By digest only: an image that later fails the scan is never reachable
      # through a version tag. BUILDX_GIT_INFO=false and a public builder-id
      # keep the CI server's internal address out of the provenance
      # attestation, which is published with the image.
      - name: Build and push by digest
        id: build
        uses: https://data.forgejo.org/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: mode=min,builder-id=https://github.com/beefstew809/grab
          sbom: true
        env:
          BUILDX_GIT_INFO: "false"

      # Trivy CLI directly (checksum-verified), not trivy-action: that action
      # resolves a nested action by a bare reference that Forgejo can't fetch.
      - name: Scan the image
        env:
          TRIVY_VERSION: "0.76.1" # bump this line to update trivy
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          sums="trivy_${TRIVY_VERSION}_checksums.txt"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          work=$(mktemp -d)
          curl -sSL -o "$work/$tarball" "$base/$tarball"
          curl -sSL -o "$work/$sums" "$base/$sums"
          ( cd "$work" && grep " ${tarball}\$" "$sums" | sha256sum -c - )
          tar -xzf "$work/$tarball" -C "$work" trivy
          install -m 0755 "$work/trivy" /usr/local/bin/trivy
          rm -rf "$work"
          trivy image --image-src remote --exit-code 1 --ignore-unfixed \
            --severity CRITICAL,HIGH "${IMAGE}@${DIGEST}"

      # Backstop for the attestations: they ship with the image, so they get
      # the same deny-list as the source.
      - name: Check attestations for personal strings
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          if [ -z "$GRAB_DENYLIST" ]; then echo "GRAB_DENYLIST is not set" >&2; exit 1; fi
          work=$(mktemp -d)
          printf '%s' "$GRAB_DENYLIST" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' > "$work/deny"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Provenance}}' > "$work/att"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .SBOM}}' >> "$work/att"
          if grep -F -i -q -f "$work/deny" "$work/att"; then
            echo "attestations contain a denied string; not tagging" >&2
            exit 1
          fi
          rm -rf "$work"

      - name: Apply version tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version=${REF_NAME#v}
          minor=$(echo "$version" | cut -d. -f1,2)
          set -- -t "${IMAGE}:${version}" -t "${IMAGE}:${minor}"
          # Pre-releases (v2.1.0-rc1) never move latest.
          case $version in *-*) ;; *) set -- "$@" -t "${IMAGE}:latest" ;; esac
          docker buildx imagetools create "$@" "${IMAGE}@${DIGEST}"

  # Two jobs, not one with `if: !failure()`: Forgejo skips a job whose
  # `needs` include a skipped job, so a single job that needed `image` never
  # ran on main pushes (where `image` is skipped).
  github-main:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Push main to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu
          set +x
          auth=$(printf 'beefstew809:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          # Scoped to github.com so it never mixes with the checkout's own
          # credentials; no token in the URL, no force.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push "$GITHUB_REPO" HEAD:refs/heads/main

  github-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, image]
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Push the tag to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          set +x
          auth=$(printf 'beefstew809:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push "$GITHUB_REPO" "refs/tags/${REF_NAME}"
