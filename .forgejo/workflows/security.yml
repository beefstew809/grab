name: security

# Dependency, filesystem and secret scans, shared with the other homelab apps
# through a reusable workflow (its README documents the exception formats).
# Pull requests and manual runs only: on main, publish.yml runs the same scan
# as a gate before anything is released.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    uses: homelab/ci-workflows/.forgejo/workflows/app-security.yml@main
    with:
      go_dirs: .
